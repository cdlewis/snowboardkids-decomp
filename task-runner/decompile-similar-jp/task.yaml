# Run with VERSION=jp nigel decompile-similar-jp so shared verification builds JP.
candidate_source: python3 tools/score_functions.py asm.jp/nonmatchings --json --by-similarity --top-n 3
prompt: "decompile the Japanese-version function: $INPUT[0]. Locate its assembly under asm.jp/nonmatchings and integrate changes into src/jp. These similar US functions have been matched and might provide useful references: $INPUT[1:]. If a reference is only available on one worktree, that worktree will be indicated in parentheses, e.g. `myFunction (../sbk-a)`. When creating your claude environment, pass the full asm.jp/nonmatchings/.../$INPUT[0].s path to ./tools/claude --bootstrap-only and use --id $TASK_ID; function-name lookup searches US assembly only. Verify with ./tools/build-and-verify.sh --version jp. Use --version jp when running asm-differ. Come up with your own match by carefully considering the purpose of the function (and therefore what it must / must not logically do) and comparing it with the provided references."
agent: codex
success_command: 'git add -u && git commit -m "matched JP $CANDIDATE"'
timeout: 30m
