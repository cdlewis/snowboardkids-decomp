candidate_source: ls -1 src/*.c
prompt: "Examine the functions defined in $INPUT. Consider whether their current name is approapriate. If not, rename them to something more descriptive and consistent with the rest of the codebase. Also, check symbols used in the source file and rename them if they are not descriptive. Finally, consider whether the file itself is appropriately named, if you have a better name in mind add it to the pending-renames file in the root of this repository. You will need to use the rename-global skill to safely make these changes. This may reveal inconsistencies, in the project. You should follow these leads and not just try to create a bandaid solution. Commit your changes when you're done."
claude_command: codex
success_command: 'git add -A && git commit -m "name-functions-and-symbols: $CANDIDATE"'
