name: build

on:
  push:
    branches: [main]

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: us
            report_version: usa
            baserom: snowboardkids.z64
          - version: jp
            report_version: jp
            baserom: snowboardkids.jp.z64
    env:
      VERSION: ${{ matrix.version }}
      REPORT_VERSION: ${{ matrix.report_version }}
      BASEROM_FILENAME: ${{ matrix.baserom }}

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang wget binutils-mips-linux-gnu

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: main

      - name: Checkout baserom
        uses: actions/checkout@v4
        with:
          repository: cdlewis/snowboardkids-private
          token: ${{ secrets.PRIVATE_REPO_ACCESS }}
          path: baserom

      - name: Decrypt baserom
        run: gpg --quiet --batch --yes --decrypt --passphrase "$BASEROM_KEY" --output "$BASEROM_FILENAME" "$BASEROM_FILENAME.gpg"
        env:
          BASEROM_KEY: ${{ secrets.BASEROM_KEY }}
        working-directory: baserom

      - name: Copy decrypted rom to main repo
        run: cp "baserom/$BASEROM_FILENAME" main/

      - name: Build toolchain
        run: make -s -C tools
        working-directory: main

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements-build.txt
        working-directory: main

      - name: Build and verify ROM
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          make VERSION="$VERSION" extract
          make -j8 VERSION="$VERSION" all
        working-directory: main

      - name: Generate objdiff report
        run: PATH="$(pwd)/.venv/bin:$PATH" python3 -m mapfile_parser objdiff_report --version "$REPORT_VERSION"
        working-directory: main

      - name: Upload progress report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: main/report.json
          if-no-files-found: error

      - name: Trigger symbol regeneration
        if: matrix.version == 'us'
        env:
          GH_TOKEN: ${{ secrets.SYMBOLS_DISPATCH_TOKEN }}
          DECOMP_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/cdlewis/snowboardkids-recomp-syms/dispatches \
            -f event_type=decomp-updated \
            -f "client_payload[sha]=$DECOMP_SHA"
